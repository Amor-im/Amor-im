<style>@font-face{font-family:JB;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.SG700{font-family:SG,'Space Grotesk',sans-serif;font-weight:700}
.SG500{font-family:SG,'Space Grotesk',sans-serif;font-weight:500}
.IN400{font-family:IN,Inter,sans-serif;font-weight:400}
.IN600{font-family:IN,Inter,sans-serif;font-weight:600}
.JB400{font-family:JB,'JetBrains Mono',monospace;font-weight:400}
.JB700{font-family:JB,'JetBrains Mono',monospace;font-weight:700}

.scan{animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(560px)}}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.hexblink{animation:hb 3s ease-in-out infinite}
@keyframes hb{0%,100%{opacity:0}50%{opacity:1}}
.dot{animation:dot 1.6s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}

.mascot{animation:float 3.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.spark{animation:spark 1.3s steps(2) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spark{0%{opacity:1}100%{opacity:.15}}

.base{opacity:.18;animation:base 3.6s linear infinite}
@keyframes base{0%,100%{opacity:.14}8%{opacity:1}22%{opacity:.14}}
</style>

