<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="620" height="300" viewBox="0 0 620 300" fill="none">
<style>@font-face{font-family:SG;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:IN;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}@font-face{font-family:JB;font-weight:700;src:url(data:font/woff2;base64,) format('woff2')}
.SG700{font-family:SG,'Space Grotesk',sans-serif;font-weight:700}
.SG500{font-family:SG,'Space Grotesk',sans-serif;font-weight:500}
.IN400{font-family:IN,Inter,sans-serif;font-weight:400}
.IN600{font-family:IN,Inter,sans-serif;font-weight:600}
.JB400{font-family:JB,'JetBrains Mono',monospace;font-weight:400}
.JB700{font-family:JB,'JetBrains Mono',monospace;font-weight:700}

.scan{animation:scan 6s linear infinite}
@keyframes scan{0%{transform:translateY(-120px)}100%{transform:translateY(560px)}}
.pulse{animation:pulse 4s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:.55}50%{opacity:1}}
.hexblink{animation:hb 3s ease-in-out infinite}
@keyframes hb{0%,100%{opacity:0}50%{opacity:1}}
.dot{animation:dot 1.6s ease-in-out infinite}
@keyframes dot{0%,100%{opacity:1}50%{opacity:.25}}

.mascot{animation:float 3.2s ease-in-out infinite}
.eyes{transform-box:fill-box;transform-origin:center;animation:blink 5s infinite}
.antenna{transform-box:fill-box;transform-origin:50% 100%;animation:sway 2.6s ease-in-out infinite}
.spark{animation:spark 1.3s steps(2) infinite}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-40px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}95%{transform:scaleY(.08)}}
@keyframes sway{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg)}}
@keyframes spark{0%{opacity:1}100%{opacity:.15}}

.base{opacity:.18;animation:base 3.6s linear infinite}
@keyframes base{0%,100%{opacity:.14}8%{opacity:1}22%{opacity:.14}}
</style>

<defs>
<pattern id="hex" width="58.89" height="102" patternUnits="userSpaceOnUse"><g stroke="#6BF19C" stroke-opacity="0.08" stroke-width="1.2" fill="none"><polygon points="29.44,0.00 58.89,17.00 58.89,51.00 29.44,68.00 -0.00,51.00 0.00,17.00"/><polygon points="0.00,51.00 29.44,68.00 29.44,102.00 0.00,119.00 -29.44,102.00 -29.44,68.00"/><polygon points="58.89,51.00 88.33,68.00 88.33,102.00 58.89,119.00 29.44,102.00 29.44,68.00"/></g></pattern>
<radialGradient id="fade" cx="50%" cy="50%" r="70%"><stop offset="0" stop-color="#fff" stop-opacity="1"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
<radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#6BF19C" stop-opacity=".35"/><stop offset=".55" stop-color="#6BF19C" stop-opacity=".07"/><stop offset="1" stop-color="#6BF19C" stop-opacity="0"/></radialGradient>
<linearGradient id="scan" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#6BF19C" stop-opacity="0"/><stop offset=".85" stop-color="#6BF19C" stop-opacity=".05"/><stop offset=".97" stop-color="#6BF19C" stop-opacity=".14"/><stop offset="1" stop-color="#6BF19C" stop-opacity="0"/></linearGradient>
<filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<clipPath id="clip"><rect width="620" height="300" rx="22"/></clipPath><rect width="620" height="300" rx="22" fill="#0F0F0F"/>
<g clip-path="url(#clip)">
  <rect width="620" height="300" fill="url(#hex)" opacity=".7"/>
  <ellipse cx="520" cy="150" rx="190" ry="170" fill="url(#glow)" opacity=".8"/>
  <rect x="420" y="46" width="168" height="50" rx="16" fill="#F2F4E4" fill-opacity="0.06" stroke="#F2F4E4" stroke-opacity=".5"/><text x="440" y="78" class="IN400" font-size="18" fill="#F2F4E4">Oi! Tem horário?</text><rect x="456" y="110" width="140" height="50" rx="16" fill="#6BF19C" fill-opacity="0.12" stroke="#6BF19C" stroke-opacity=".5"/><text x="476" y="142" class="IN400" font-size="18" fill="#6BF19C">Tenho sim :)</text><rect x="420" y="174" width="92" height="40" rx="16" fill="#F2F4E4" fill-opacity="0.06" stroke="#F2F4E4" stroke-opacity=".5"/><circle cx="446" cy="194" r="6" fill="#6BF19C"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin="0.0s" repeatCount="indefinite"/></circle><circle cx="466" cy="194" r="6" fill="#6BF19C"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin="0.2s" repeatCount="indefinite"/></circle><circle cx="486" cy="194" r="6" fill="#6BF19C"><animate attributeName="opacity" values=".2;1;.2" dur="1.2s" begin="0.4s" repeatCount="indefinite"/></circle>
</g>
<text x="36" y="56" class="JB700" font-size="17" fill="#6BF19C" letter-spacing="3">AUTOMAÇÃO · N8N</text>
<text x="34" y="122" class="SG700" font-size="52" fill="#F2F4E4">Agentes IA</text>
<text x="36" y="168" class="IN400" font-size="22" fill="#7A8A80">Atendimento e SDR no WhatsApp</text>
<text x="36" y="198" class="IN400" font-size="22" fill="#7A8A80">e Instagram, 24 horas.</text>
<g transform="translate(36,236)">
  <rect width="184" height="38" rx="19" fill="#6BF19C" fill-opacity=".1" stroke="#6BF19C" stroke-opacity=".55"/>
  <circle class="dot" cx="22" cy="19" r="6" fill="#6BF19C"/>
  <text x="38" y="25" class="JB700" font-size="17" fill="#6BF19C" letter-spacing="1">SOB MEDIDA</text>
</g>
<rect x="1" y="1" width="618" height="298" rx="21" stroke="#22302A" stroke-width="2"/>
</svg>