name: mutacao-contribuicoes

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  snake:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=#6BF19C&color_dots=#161B18,#1B3A26,#2C6B43,#47A86A,#6BF19C&color_background=#0F0F0F
            dist/snake-light.svg?color_snake=#0F0F0F&color_dots=#EBEDF0,#C9F5D9,#9AE9B7,#6BF19C,#2FB768
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
